name: Main CI Pipeline
on: [push, pull_request]
jobs:
  backend:
    name: Build and lint ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - car-service
          - api-gateway-service
    defaults:
      run:
        working-directory: code/backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/backend/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        env:
          DATABASE_URL: file:/tmp/ci.sqlite
        run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: file:/tmp/ci.sqlite
        run: npm run prisma:generate --if-present
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
