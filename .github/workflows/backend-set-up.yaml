name: Set Up (Build and Lint) Backend Service Checks
on: [push, pull_request]
jobs:
  backend-set-up-checks:
    name: Set up ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - warehouse-service
          - webshop-service
          - hongkong-service
          - dhl-service
          - printz-service
          - control-tower-service
          - api-gateway-service
    defaults:
      run:
        working-directory: code/backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/backend/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
